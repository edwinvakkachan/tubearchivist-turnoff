version: "3.8"

services:

  tubearchivistturnoff:

    build: .

    container_name: tubearchivistturnoff

    restart: unless-stopped

    environment:
      WEBHOOK_TUBEARCHIVISTOff: ${WEBHOOK_TUBEARCHIVISTOff}
      TUBEARCHIVIST_URL: ${TUBEARCHIVIST_URL}
      TUBEARCHIVIST_TOKEN: ${TUBEARCHIVIST_TOKEN}

    dns:
      - 1.1.1.1
      - 1.0.0.1

    networks:
      - shared_network

    mem_limit: 256m
    mem_reservation: 128m

    cpus: 0.50

    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  shared_network:
    external: true